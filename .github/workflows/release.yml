name: Release

# package.json の version を上げて main に push してから、手動で実行する。
# main には built/ を置かず、built/ を足したコミットを作って v<version> のタグだけを push する。
# 利用側は git の依存としてこのタグを参照するので、入れるときにビルドが要らない。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Decide the tag
        id: tag
        run: |
          tag="v$(jq -r .version package.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag already exists. Bump the version in package.json first."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run --bun test
      - run: bun run build
      - name: Commit the built files and push the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force built
          git commit --quiet -m "release: $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
